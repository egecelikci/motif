name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies from the lockfile
        run: deno ci
      - name: Formatting
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Unit tests
        run: deno task test
      - name: Generated files are up to date
        run: deno task check
